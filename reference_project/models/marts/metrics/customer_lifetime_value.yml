models:
  - name: customer_lifetime_value
    description: >
      Lifetime value per customer. One row per real customer with at least one qualifying
      order (internal "QA Test Account" customers and refunded orders are excluded).
      lifetime_revenue is the sum of qualifying order totals including tax.
      avg_order_value is lifetime_revenue / lifetime_orders. avg_order_supply_cost is the
      mean supply cost over qualifying orders that have item records; orders with no item
      records are excluded from the average rather than counted as zero.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_order_date >= first_order_date"
    columns:
      - name: customer_id
        data_type: varchar
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: customer_name
        data_type: varchar
      - name: first_order_date
        data_type: date
      - name: last_order_date
        data_type: date
      - name: lifetime_orders
        data_type: bigint
      - name: lifetime_revenue
        data_type: decimal(18,2)
      - name: avg_order_value
        data_type: double
      - name: avg_order_supply_cost
        data_type: double

unit_tests:
  - name: test_customer_lifetime_value_aggregates_orders
    description: Two ordinary orders for one customer aggregate into one row.
    model: customer_lifetime_value
    given:
      - input: ref('orders')
        rows:
          - {order_id: o1, customer_id: c1, ordered_at_ts: "2025-01-05 09:00:00", order_total: 10.00, order_cost: 2.00}
          - {order_id: o2, customer_id: c1, ordered_at_ts: "2025-02-07 12:00:00", order_total: 20.00, order_cost: 4.00}
      - input: ref('stg_customers')
        rows:
          - {customer_id: c1, customer_name: Ada, is_test_account: false}
      - input: ref('stg_refunds')
        format: sql
        rows: select cast(null as varchar) as order_id where false
    expect:
      rows:
        - {customer_id: c1, customer_name: Ada, first_order_date: 2025-01-05, last_order_date: 2025-02-07, lifetime_orders: 2, lifetime_revenue: 30.00, avg_order_value: 15.0, avg_order_supply_cost: 3.0}

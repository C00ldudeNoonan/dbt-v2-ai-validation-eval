models:
  - name: product_margin_monthly
    description: >
      Monthly units, revenue, supply cost and gross margin per product (SKU), from items on
      qualifying orders (internal "QA Test Account" customers and refunded orders are
      excluded). revenue is the sum of item list prices; supply_cost is the sum of each
      item's per-unit supply cost; gross_margin = revenue - supply_cost.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_month, product_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "gross_margin = revenue - supply_cost"
    columns:
      - name: order_month
        data_type: date
        data_tests: [not_null]
      - name: product_id
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: product_name
        data_type: varchar
      - name: units_sold
        data_type: bigint
      - name: revenue
        data_type: decimal(18,2)
      - name: supply_cost
        data_type: decimal(18,2)
      - name: gross_margin
        data_type: decimal(18,2)
